# CAP6942 Fall 2026
#
# IMPORTANT:
# Numeric business thresholds in this development version are
# provisional engineering values. They can be revised through
# project change control as the system is evaluated.
#
# Compliance-related rules are engineering design inputs for the
# academic prototype and are not a substitute for legal review.
# ============================================================

policy_version: "0.1-dev"

agent:
  autonomous_action_enabled: true
  classification_confidence_threshold: 0.75
  max_tool_calls_per_decision: 8
  max_identical_tool_calls: 2
  max_revision_attempts_after_rejection: 1

intent_precedence:
  - HOSTILE_OR_ADVERSARIAL
  - AMOUNT_DISPUTE
  - ALREADY_PAID_CLAIM
  - PAYMENT_PLAN_REQUEST
  - PROMISE_TO_PAY
  - DELIVERY_DISPUTE
  - UNCLEAR

risk:
  score_staleness_days: 30
  unavailable_score_default_band: CRITICAL

  bands:
    LOW:
      minimum: 0.00
      maximum: 0.30
    MEDIUM:
      minimum: 0.30
      maximum: 0.60
    HIGH:
      minimum: 0.60
      maximum: 0.80
    CRITICAL:
      minimum: 0.80
      maximum: 1.00

payment_plans:
  LOW:
    max_duration_days: 60
    minimum_down_payment_pct: 0.20
    autonomous_allowed: true

  MEDIUM:
    max_duration_days: 45
    minimum_down_payment_pct: 0.25
    autonomous_allowed: false

  HIGH:
    max_duration_days: 30
    minimum_down_payment_pct: 0.40
    autonomous_allowed: false

  CRITICAL:
    max_duration_days: 0
    minimum_down_payment_pct: 1.00
    autonomous_allowed: false

contact:
  consumer_quiet_hours:
    start: "21:00"
    end: "08:00"

  email_exempt_from_quiet_hours: true
  max_contacts_per_7_days: 4
  sms_requires_affirmative_consent: true
  honor_channel_opt_out: true
  opt_out_requires_escalation: true

escalation:
  disputed_amount_threshold: 5000.00

  high_value_account:
    lifetime_value_threshold: 50000.00
    tenure_months_threshold: 36

  legal_or_sensitive_terms:
    - attorney
    - lawyer
    - litigation
    - lawsuit
    - sue you
    - bankruptcy
    - regulator
    - regulatory complaint
    - complaint to the state
    - died
    - deceased
    - death
    - serious illness

hard_constraints:
  autonomous_discount_allowed: false
  autonomous_waiver_allowed: false
  autonomous_writeoff_allowed: false
  autonomous_service_hold_allowed: false
  require_ledger_evidence_for_debt_assertion: true
  unauthorized_consequence_language_allowed: false
  third_party_collector_representation_allowed: false
  sms_without_consent_allowed: false
  missing_or_stale_risk_requires_highest_band: true

soft_constraints:
  prefer_email_for_low_risk_accounts: true
  prefer_human_call_flag_for_high_risk_accounts: true
  reduce_contact_after_customer_response: true
  prefer_deescalation_for_hostile_language: true
  prioritize_existing_customer_relationship: true
