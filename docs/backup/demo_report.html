<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cleartide ACA — class demo</title>
<style>
  :root {
    --navy: #0b1f33;
    --navy-2: #163257;
    --ink: #0e2740;
    --muted: #5a7089;
    --line: #d5e0e4;
    --paper: #f1f6f7;
    --card: #ffffff;
    --teal: #2bbbad;
    --teal-deep: #1e8f86;
    --amber: #9a5b12;
    --red: #8d2f39;
    --green: #0e7a4b;
    --shadow: 0 16px 40px rgba(11, 31, 51, 0.08);
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(1200px 400px at 100% -10%, rgba(43, 187, 173, 0.18), transparent 50%),
      var(--paper);
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
    line-height: 1.45;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 22px 36px 18px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .brand { display: flex; gap: 16px; align-items: center; }
  .brand h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.03em; }
  .brand p { margin: 2px 0 0; color: #a9c2c9; font-size: 0.95rem; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  nav button {
    border: 1px solid rgba(255,255,255,0.16);
    background: transparent;
    color: white;
    border-radius: 999px;
    padding: 8px 14px;
    font: inherit;
    font-size: 0.92rem;
    cursor: pointer;
  }
  nav button.active { background: var(--teal); color: #06251f; border-color: var(--teal); font-weight: 700; }
  main { padding: 28px 36px 72px; max-width: 1440px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }
  h2 { font-size: 2rem; letter-spacing: -0.03em; margin: 0 0 8px; }
  .lede { font-size: 1.2rem; max-width: 980px; margin: 0 0 22px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }
  .kicker { color: var(--teal-deep); font-weight: 700; letter-spacing: 0.08em; font-size: 0.78rem; text-transform: uppercase; }
  .muted { color: var(--muted); }
  .pipeline { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin: 8px 0 18px; }
  .step {
    background: #e6eef0;
    border-radius: 14px;
    padding: 10px 10px 12px;
    min-height: 108px;
  }
  .step b { display: block; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .step span { display: block; margin-top: 6px; font-weight: 700; font-size: 0.95rem; }
  .step.go { background: #e7f8f6; }
  .step.stop { background: #fde8e4; }
  .step.hold { background: #fff4e5; }
  .stamp {
    display: inline-block;
    border-radius: 12px;
    padding: 8px 14px;
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  .stamp.ok { background: #e5f6ee; color: var(--green); }
  .stamp.warn { background: #fff4e5; color: var(--amber); }
  .stamp.bad { background: #fde8e4; color: var(--red); }
  .mono, pre {
    font-family: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.86rem;
    white-space: pre-wrap;
    background: #0b1f33;
    color: #e7f6f4;
    border-radius: 14px;
    padding: 14px 16px;
  }
  button.action, .pills button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    background: var(--navy);
    color: white;
  }
  button.action.secondary { background: var(--teal); color: #06251f; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pills button { background: white; color: var(--ink); border: 1px solid var(--line); }
  ol.timeline { margin: 8px 0 0; padding-left: 22px; }
  ol.timeline li { margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 0.92rem; }
  th { background: var(--navy); color: white; }
  .bar { height: 22px; background: #e6eef0; border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal-deep), var(--teal)); }
  .metric { min-width: 160px; }
  .metric strong { display: block; font-size: 1.8rem; letter-spacing: -0.03em; }
  .metrics { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .cue { margin-top: 18px; padding: 12px 14px; border-left: 4px solid var(--teal); background: white; border-radius: 0 12px 12px 0; }
  svg.arch { width: 100%; height: auto; }
  @media (max-width: 1100px) {
    .grid-3, .grid-2, .pipeline { grid-template-columns: 1fr; }
    main, header { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>

    </div>

  const reading = summary.reviewer_readability || {};
  const line = document.getElementById("readability-line");
  if (line && reading.packets) {
    line.textContent = `Reviewer packets: ${reading.packets}. Reading grade mean ${reading.mean_grade}, max ${reading.max_grade}, limit ${reading.grade_limit}. Briefs over the limit: ${reading.briefs_failing_proxy}. Quotes are not scored.`;
  }
}
function traceView() {
  const rows = PAYLOAD.traceability || [];
  const root = document.getElementById("view-traceability");
  root.innerHTML = `
    <p class="kicker">Requirements</p>
    <h2>Each requirement points at code and a test that ran.</h2>
    <p class="lede">Generated from pytest, not from a status someone typed. A row is passing only when every mapped test passed in that run.</p>
    <div class="card" style="overflow:auto;">
      <table><thead><tr><th>Requirement</th><th>Result</th><th>Tests</th></tr></thead><tbody>
      ${rows.map((row) => `<tr><td><b>${esc(row.requirement_id)}</b><br>${esc(row.requirement_summary)}</td><td>${esc(row.result)}</td><td>${esc((row.passed_tests || []).slice(0, 6).join(", "))}${row.failed_tests && row.failed_tests.length ? " FAILED: " + esc(row.failed_tests.join(", ")) : ""}</td></tr>`).join("")}
      </tbody></table>
    </div>
    <div class="cue">If a professor asks “where is FR-5.2?”, the row names the file and the test.</div>`;
}
function boot() {
  nav();
  overview();
  mountScenario("autonomous", "autonomous_promise", "Scenario 1", "Successful autonomous action. A promise with clean history and low risk.");
  mountScenario("review", "human_review_payment_plan", "Scenario 2", "Mandatory human review. The agent proposes a plan. Medium-risk accounts are outside autonomous authority.");
  mountScenario("blocked", "blocked_policy_violation", "Scenario 3", "Blocked policy violation. An unsafe draft is injected so the class can see the harness stop it.");
  auditView();
  evaluationView();
  traceView();
  const initial = (location.hash || "#overview").slice(1);
  show(VIEWS.some(([id]) => id === initial) ? initial : "overview");
  document.addEventListener("keydown", (event) => {
    const index = Number(event.key) - 1;
    if (index >= 0 && index < VIEWS.length) show(VIEWS[index][0]);
  });
  if (LIVE) {
    fetch("/api/decisions").then((response) => response.json()).then((decisions) => {
      PAYLOAD.decisions = decisions;
      renderAuditList(decisions);
    }).catch(() => {});
  }
}
boot();
</script>
